[workspace]
members = [
    "apps/agent",
    "apps/server",
    "crates/protocol",
]
resolver = "3"

[workspace.package]
version = "0.6.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicate versions come from third-party crates' own dependency ranges and
# cannot be resolved from this workspace.
multiple_crate_versions = "allow"

[workspace.dependencies]
argon2 = "0.6"
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"
futures-util = "0.3"
axum = "0.8"
deckox-protocol = { path = "crates/protocol" }
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
totp-rs = { version = "5.7", default-features = false, features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
