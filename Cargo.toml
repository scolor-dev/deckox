[workspace]
members = [
    "apps/agent",
    "apps/server",
    "apps/terminal",
    "crates/protocol",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
deckox-protocol = { path = "crates/protocol" }
hex = "0.4"
rand = "0.9"
portable-pty = "0.9"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
