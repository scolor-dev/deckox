[workspace]
members = [
    "apps/agent",
    "apps/server",
    "crates/protocol",
]
resolver = "3"

[workspace.package]
version = "0.3.8"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
axum = "0.8"
base64 = "0.22"
deckox-protocol = { path = "crates/protocol" }
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustix = { version = "1.1", features = ["fs", "process"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
