<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">Deckoxのリリースとインストールの流れ</title>
  <desc id="desc">Gitタグからx86-64とARM64を並列ビルドし、GitHub Releaseへ公開した後、インストーラーがCPUに対応する成果物を取得してsystemdへ登録する流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1040" height="470" rx="24" fill="#080e18"/>
  <text x="52" y="53" fill="#5eead4" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">RELEASE &amp; INSTALL FLOW</text>

  <g transform="translate(52 92)">
    <rect width="178" height="110" rx="14" fill="#111d2e" stroke="#2d415b"/>
    <text x="20" y="39" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Git tag</text>
    <text x="20" y="68" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="12">v0.1.0</text>
    <text x="20" y="91" fill="#617187" font-family="system-ui,sans-serif" font-size="12">pushで開始</text>
  </g>

  <path d="M230 147 H290" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(300 76)">
    <rect width="238" height="142" rx="14" fill="#111d2e" stroke="#2d415b"/>
    <text x="20" y="36" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">GitHub Actions</text>
    <rect x="20" y="57" width="198" height="27" rx="6" fill="#123731"/>
    <text x="31" y="75" fill="#8ff7e7" font-family="ui-monospace,monospace" font-size="11">x86_64-linux-musl</text>
    <rect x="20" y="94" width="198" height="27" rx="6" fill="#152f43"/>
    <text x="31" y="112" fill="#a5e2ff" font-family="ui-monospace,monospace" font-size="11">aarch64-linux-musl</text>
  </g>

  <path d="M538 147 H598" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(608 76)">
    <rect width="198" height="142" rx="14" fill="#111d2e" stroke="#2d415b"/>
    <text x="20" y="36" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">GitHub Release</text>
    <text x="20" y="70" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="12">tar.gz × 2</text>
    <text x="20" y="93" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="12">SHA-256 × 2</text>
    <text x="20" y="118" fill="#617187" font-family="system-ui,sans-serif" font-size="11">両ビルド成功後に公開</text>
  </g>

  <path d="M806 147 H866" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(876 92)">
    <rect width="112" height="110" rx="14" fill="#123731" stroke="#286b5e"/>
    <text x="18" y="39" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">install.sh</text>
    <text x="18" y="68" fill="#8ff7e7" font-family="system-ui,sans-serif" font-size="11">CPU自動判定</text>
    <text x="18" y="90" fill="#8ff7e7" font-family="system-ui,sans-serif" font-size="11">SHA-256検証</text>
  </g>

  <path d="M932 202 V276" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(608 286)">
    <rect width="380" height="124" rx="14" fill="#0d1827" stroke="#2d415b"/>
    <text x="20" y="37" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Linux systemd</text>
    <text x="20" y="68" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="12">deckox-agent.service</text>
    <text x="20" y="91" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="12">deckox-server.service</text>
    <text x="238" y="91" fill="#5eead4" font-family="system-ui,sans-serif" font-size="12">enable --now</text>
  </g>

  <g transform="translate(52 286)">
    <rect width="486" height="124" rx="14" fill="#0b1421" stroke="#1d2c40"/>
    <text x="20" y="36" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">配布アーカイブの内容</text>
    <text x="20" y="68" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="12">bin/  web/  config/  systemd/</text>
    <text x="20" y="96" fill="#617187" font-family="system-ui,sans-serif" font-size="12">Server・Agent・Vue成果物・設定・ユニット</text>
  </g>
</svg>
