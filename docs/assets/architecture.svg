<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Deckoxの実行時アーキテクチャ</title>
  <desc id="desc">ブラウザ上のVue管理画面がAxum ServerへHTTPで接続し、ServerがUnixソケットを通じてAgentからLinux情報を取得する構成。</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1040" height="560" rx="24" fill="#080e18"/>
  <text x="54" y="54" fill="#5eead4" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">RUNTIME ARCHITECTURE</text>

  <g transform="translate(54 92)">
    <rect width="260" height="156" rx="16" fill="url(#panel)" stroke="#2c415c"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#163d38"/>
    <text x="42" y="49" text-anchor="middle" fill="#5eead4" font-family="system-ui,sans-serif" font-size="20">V</text>
    <text x="20" y="92" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Vue Web UI</text>
    <text x="20" y="120" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="14">ブラウザ上の管理画面</text>
    <text x="20" y="142" fill="#617187" font-family="ui-monospace,monospace" font-size="11">STATIC HTML / JS / CSS</text>
  </g>

  <path d="M314 170 H390" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="156" text-anchor="middle" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="11">HTTP</text>

  <g transform="translate(398 92)">
    <rect width="260" height="156" rx="16" fill="url(#panel)" stroke="#2c415c"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#173249"/>
    <text x="42" y="49" text-anchor="middle" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="18">S</text>
    <text x="20" y="92" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Deckox Server</text>
    <text x="20" y="120" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="14">Axum API中継・Vue配信</text>
    <text x="20" y="142" fill="#617187" font-family="ui-monospace,monospace" font-size="11">deckox-server</text>
  </g>

  <path d="M658 170 H734" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696" y="143" text-anchor="middle" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="10">HTTP</text>
  <text x="696" y="158" text-anchor="middle" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="10">UNIX SOCKET</text>

  <g transform="translate(742 92)">
    <rect width="244" height="156" rx="16" fill="url(#panel)" stroke="#2c415c"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#3b2d16"/>
    <text x="42" y="49" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="18">A</text>
    <text x="20" y="92" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Deckox Agent</text>
    <text x="20" y="120" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="14">Linux情報・systemd管理</text>
    <text x="20" y="142" fill="#617187" font-family="ui-monospace,monospace" font-size="11">deckox-agent</text>
  </g>

  <path d="M864 248 V332" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="883" y="296" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="11">READ / CONTROL</text>

  <g transform="translate(742 342)">
    <rect width="244" height="144" rx="16" fill="#0d1827" stroke="#2c415c"/>
    <text x="20" y="40" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Linux Host</text>
    <text x="20" y="72" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="12">/etc/hostname</text>
    <text x="20" y="96" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="12">/proc/uptime</text>
    <text x="20" y="120" fill="#617187" font-family="system-ui,sans-serif" font-size="12">systemd・OS・リソース</text>
  </g>

  <g transform="translate(54 308)">
    <rect width="604" height="178" rx="16" fill="#0b1421" stroke="#1d2c40"/>
    <text x="22" y="35" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">現在の境界</text>
    <line x1="22" y1="53" x2="582" y2="53" stroke="#1d2c40"/>
    <circle cx="31" cy="82" r="4" fill="#5eead4"/>
    <text x="46" y="87" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">外部公開されるのはServerのHTTPポートのみ</text>
    <circle cx="31" cy="116" r="4" fill="#5eead4"/>
    <text x="46" y="121" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">Agentは /run/deckox/agent.sock のみで待受</text>
    <circle cx="31" cy="150" r="4" fill="#fbbf24"/>
    <text x="46" y="155" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">systemd変更は完全一致の許可リストに限定</text>
  </g>
</svg>
