<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Deckoxの実行時アーキテクチャ</title>
  <desc id="desc">Vue管理画面がAxum Serverへ接続し、ServerがUnixソケット経由でroot Agentの型付きLinux操作を呼び出す構成。</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#132238"/><stop offset="1" stop-color="#0b1422"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#5eead4"/></marker>
  </defs>
  <rect width="1040" height="620" rx="24" fill="#080e18"/>
  <text x="54" y="52" fill="#5eead4" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">RUNTIME ARCHITECTURE · v0.3.7</text>

  <g transform="translate(54 88)">
    <rect width="250" height="150" rx="16" fill="url(#panel)" stroke="#2c415c"/>
    <text x="22" y="44" fill="#5eead4" font-family="ui-monospace,monospace" font-size="13">BROWSER</text>
    <text x="22" y="82" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Vue Web UI</text>
    <text x="22" y="112" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="14">REST · SSE</text>
    <text x="22" y="134" fill="#617187" font-family="system-ui,sans-serif" font-size="12">日本語 / English</text>
  </g>

  <path d="M304 163 H390" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="347" y="148" text-anchor="middle" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="10">HTTP / SSE</text>

  <g transform="translate(398 88)">
    <rect width="250" height="150" rx="16" fill="url(#panel)" stroke="#2c415c"/>
    <text x="22" y="44" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="13">deckox user</text>
    <text x="22" y="82" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Deckox Server</text>
    <text x="22" y="112" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="14">認証 · API · Vue配信</text>
    <text x="22" y="134" fill="#617187" font-family="system-ui,sans-serif" font-size="12">外部HTTPの唯一の入口</text>
  </g>

  <path d="M648 133 H730" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="689" y="113" text-anchor="middle" fill="#8fa0b6" font-family="ui-monospace,monospace" font-size="10">HTTP / UDS</text>
  <g transform="translate(738 70)">
    <rect width="248" height="136" rx="16" fill="url(#panel)" stroke="#5f4921"/>
    <text x="20" y="38" fill="#fbbf24" font-family="ui-monospace,monospace" font-size="13">root</text>
    <text x="20" y="73" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Deckox Agent</text>
    <text x="20" y="102" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="13">型付きLinux操作のみ</text>
    <text x="20" y="122" fill="#617187" font-family="ui-monospace,monospace" font-size="11">/run/deckox/agent.sock</text>
  </g>

  <path d="M862 206 V428" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(738 438)">
    <rect width="248" height="126" rx="16" fill="#0d1827" stroke="#2c415c"/>
    <text x="20" y="40" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Linux Host</text>
    <text x="20" y="72" fill="#8fa0b6" font-family="system-ui,sans-serif" font-size="13">systemd · /proc · SSH鍵</text>
    <text x="20" y="98" fill="#617187" font-family="system-ui,sans-serif" font-size="12">許可された操作だけをAgentが実行</text>
  </g>

  <g transform="translate(54 300)">
    <rect width="594" height="264" rx="16" fill="#0b1421" stroke="#1d2c40"/>
    <text x="24" y="40" fill="#edf4ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">プロセスと権限の境界</text>
    <line x1="24" y1="58" x2="570" y2="58" stroke="#1d2c40"/>
    <circle cx="32" cy="88" r="4" fill="#7dd3fc"/><text x="48" y="93" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">Serverだけがブラウザからの通信と認証情報を扱う</text>
    <circle cx="32" cy="124" r="4" fill="#fbbf24"/><text x="48" y="129" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">Agentはrootだが、許可済みの型付き操作だけを受付</text>
    <circle cx="32" cy="160" r="4" fill="#5eead4"/><text x="48" y="165" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">AgentはUnixソケットだけで待ち受け、TCPポートを持たない</text>
    <circle cx="32" cy="196" r="4" fill="#5eead4"/><text x="48" y="201" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="13">任意コマンドを実行するWebコンソールは提供しない</text>
  </g>
</svg>
