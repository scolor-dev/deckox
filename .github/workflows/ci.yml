name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -W clippy::pedantic -W clippy::nursery

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check installer scripts
        run: >-
          sh -n packaging/scripts/install.sh scripts/package-release.sh
          scripts/release.sh scripts/test-installer.sh

      - name: Test installer safety flows
        run: scripts/test-installer.sh

  web:
    name: Vue
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build
