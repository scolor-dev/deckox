version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint and vue-tsc do not support TypeScript 7 yet
      # (ERESOLVE on install; vue-tsc cannot load its API).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vue-i18n 11.4 types need a newer Vue than 3.5.x provides
      # (TS2724: 'GenericComponentInstance' is not exported by "vue").
      - dependency-name: "vue-i18n"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@intlify/devtools-types"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
