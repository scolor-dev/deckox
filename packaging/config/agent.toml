# Deckox Agent configuration
# The Agent listens only on this local Unix socket.
socket = "/run/deckox/agent.sock"

# Service state can always be read. Start, stop, and restart are permitted only
# for service IDs listed here. Deckox's own services are always rejected.
[services]
allowed = []

# SSH public-key management is disabled until a non-root Linux account is set.
# Deckox never stores private keys and does not change sshd configuration.
[ssh]
# managed_user = "operator"
