# Deckox Agent configuration
# The Agent listens only on this local Unix socket.
socket = "/run/deckox/agent.sock"

# Reboot stays disabled until explicitly enabled. The Web UI also requires the
# administrator password again before calling the fixed reboot operation.
#
# Self-update from the Web UI is likewise disabled until explicitly enabled.
# The Web UI requires the administrator password again before requesting it;
# the Server then fetches the installer for the release it already reported
# as available and hands it to the Agent, which runs it as an independent
# systemd unit.
[system]
allow_reboot = false
allow_update = false

# Package state can always be read. Install, remove, and upgrade are permitted
# only for managed package names: those listed in `allowed`, plus (when
# `auto_adopt` is true) packages you installed on purpose — for apt, the ones
# `apt-mark showmanual` reports, with any that another one depends on or
# recommends (docker-ce-cli under docker-ce, for example) bundled under it in
# the Web UI, and for dnf the same using rpm's requires and recommends; for
# pacman the explicitly installed ones nothing else requires (zypper keeps no
# such record).
# Base-system packages are never adopted. A package you remove from management
# is remembered in `dismissed` so it is not adopted again. Names in `allowed`
# were confirmed, when added, to resolve from this host's own configured
# package repositories (apt, dnf, pacman, or zypper) or to be installed
# already — Deckox never adds a new third-party repository or signing key to
# install something. This table must stay before [services] so the Web UI's
# allowlist edits to each table never clobber the other.
[software]
auto_adopt = true
allowed = []
dismissed = []

# Service state can always be read. Start, stop, and restart are permitted only
# for service IDs listed here. Deckox's own services are always rejected.
[services]
allowed = []
